<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Podcast Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #181818;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #242424;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #1ed760;
        }
        .instruction {
            font-size: 12px;
            color: #b3b3b3;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Spotify Downloader</h2>
        <p>Pega tu enlace de Spotify:</p>
        <input type="text" id="urlInput" placeholder="https://open.spotify.com/episode/...">
        <button onclick="copiarComando()">Copiar Comando para la Terminal</button>
        <p class="instruction" id="msg"></p>
    </div>

    <script>
        function copiarComando() {
            const url = document.getElementById('urlInput').value;
            if(!url) {
                alert("Por favor, introduce un enlace válido.");
                return;
            }
            const comando = `python spotify_podcast_download.py "${url}"`;
            navigator.clipboard.writeText(comando);
            document.getElementById('msg').innerText = "¡Comando copiado! Pégalo en tu terminal abierta.";
        }
    </script>
</body>
</html>
