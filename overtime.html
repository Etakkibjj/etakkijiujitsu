<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ETAKKI BJJ Referee Scoreboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Montserrat (for Smoothcomp UI text/headings) & Oswald (for scoreboard numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* Smoothcomp Clean Dark UI Aesthetic */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #161C26;
            color: #FFFFFF;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-smooth {
            font-family: 'Montserrat', sans-serif;
        }

        .font-oswald {
            font-family: 'Oswald', sans-serif;
        }

        /* Smoothcomp Solid Colors */
        .bg-smooth-dark {
            background-color: #19202D;
        }
        .bg-smooth-card {
            background-color: #212B3B;
        }
        .bg-smooth-blue {
            background-color: #1360EF;
        }
        .bg-smooth-red {
            background-color: #D32F2F;
        }

        /* Active button feedback */
        .btn-tap:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        /* Flash on timer finish */
        @keyframes flash-timer {
            0%, 100% { opacity: 1; color: #FF4D4D; }
            50% { opacity: 0.3; color: #FFFFFF; }
        }
        .timer-ended {
            animation: flash-timer 0.6s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[#161C26] text-white flex flex-col justify-between select-none">

    <!-- TOP HEADER WITH LOGO ON THE LEFT OF ETAKKI JIU JITSU -->
    <header class="w-full bg-[#111620] border-b border-slate-700/60 px-3 py-1.5 flex items-center justify-center shrink-0 z-10 shadow-md">
        <div class="flex items-center justify-center space-x-2.5 max-w-full">
            <!-- ETAKKI DOJO Elephant Emblem Logo (Left of text) -->
            <div class="w-7 h-7 shrink-0 bg-white rounded-full p-0.5 flex items-center justify-center border border-slate-300 shadow-sm">
                <svg viewBox="0 0 100 100" class="w-full h-full text-[#111620] fill-current">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="4"/>
                    <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/>
                    <!-- Elephant Silhouette representation -->
                    <path d="M50 20 C35 20 28 32 28 44 C28 56 34 60 38 68 C40 72 42 78 45 84 C47 88 50 88 50 82 C50 74 46 68 46 62 C46 56 54 56 54 62 C54 68 50 74 50 82 C50 88 53 88 55 84 C58 78 60 72 62 68 C66 60 72 56 72 44 C72 32 65 20 50 20 Z" />
                    <!-- Ears -->
                    <path d="M30 35 C20 30 15 45 26 52 Z" />
                    <path d="M70 35 C80 30 85 45 74 52 Z" />
                </svg>
            </div>
            <!-- Header Text with Smoothcomp font aesthetic -->
            <div class="font-smooth font-extrabold text-[11px] sm:text-xs md:text-sm tracking-wider text-slate-100 uppercase truncate">
                ETAKKI JIU JITSU - EJJ SUB ONLY 3 - EBI RULES
            </div>
        </div>
    </header>

    <!-- MAIN SCORE & CONTROLS CONTAINER -->
    <div class="flex-1 flex flex-col min-h-0 w-full p-1.5 space-y-1.5">
        
        <!-- FIGHTERS SCORE BOARD (SPLIT RED / BLUE SMOOTHCOMP STYLE) -->
        <div class="grid grid-cols-2 gap-1.5 h-2/5 min-h-0 w-full">
            
            <!-- BLUE FIGHTER TOP BLOCK -->
            <div class="flex flex-col bg-[#19202D] rounded-lg overflow-hidden border border-slate-700/80 shadow-md">
                <div class="bg-smooth-blue px-2 py-1 text-center shrink-0">
                    <h2 class="font-smooth text-base sm:text-lg md:text-xl font-extrabold tracking-wider text-white leading-none uppercase">
                        LUCHADOR AZUL
                    </h2>
                </div>
                <div class="flex-1 flex items-center justify-center bg-[#131924]">
                    <span id="blue-score" class="font-oswald text-6xl sm:text-7xl md:text-8xl font-bold text-white leading-none">0</span>
                </div>
            </div>

            <!-- RED FIGHTER TOP BLOCK -->
            <div class="flex flex-col bg-[#19202D] rounded-lg overflow-hidden border border-slate-700/80 shadow-md">
                <div class="bg-smooth-red px-2 py-1 text-center shrink-0">
                    <h2 class="font-smooth text-base sm:text-lg md:text-xl font-extrabold tracking-wider text-white leading-none uppercase">
                        LUCHADOR ROJO
                    </h2>
                </div>
                <div class="flex-1 flex items-center justify-center bg-[#131924]">
                    <span id="red-score" class="font-oswald text-6xl sm:text-7xl md:text-8xl font-bold text-white leading-none">0</span>
                </div>
            </div>

        </div>

        <!-- ACTION BUTTONS GRID (COLUMNS BLUE & RED) -->
        <div class="grid grid-cols-2 gap-1.5 h-3/5 min-h-0 w-full">
            
            <!-- BLUE BUTTONS -->
            <div class="grid grid-cols-1 gap-1 h-full min-h-0">
                <button onclick="addPoints('blue', 2, 'Takedown')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">TAKEDOWN</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-blue-400">+2</span>
                </button>
                <button onclick="addPoints('blue', 2, 'Sweep')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">SWEEP</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-blue-400">+2</span>
                </button>
                <button onclick="addPoints('blue', 2, 'Knee on Belly')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">KNEE ON BELLY</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-blue-400">+2</span>
                </button>
                <button onclick="addPoints('blue', 3, 'Guard Pass')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">GUARD PASS</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-blue-400">+3</span>
                </button>
                <button onclick="addPoints('blue', 4, 'Mount')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">MOUNT</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-blue-400">+4</span>
                </button>
                <button onclick="addPoints('blue', 4, 'Back Control')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">BACK CONTROL</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-blue-400">+4</span>
                </button>
                <button onclick="subtractPoint('blue')" class="btn-tap bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-md px-2 flex items-center justify-center space-x-1">
                    <span class="font-smooth font-bold text-xs text-slate-400 uppercase">DESHACER</span>
                    <span class="font-oswald text-base text-red-400 font-bold">-1</span>
                </button>
            </div>

            <!-- RED BUTTONS -->
            <div class="grid grid-cols-1 gap-1 h-full min-h-0">
                <button onclick="addPoints('red', 2, 'Takedown')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">TAKEDOWN</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-red-400">+2</span>
                </button>
                <button onclick="addPoints('red', 2, 'Sweep')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">SWEEP</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-red-400">+2</span>
                </button>
                <button onclick="addPoints('red', 2, 'Knee on Belly')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">KNEE ON BELLY</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-red-400">+2</span>
                </button>
                <button onclick="addPoints('red', 3, 'Guard Pass')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">GUARD PASS</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-red-400">+3</span>
                </button>
                <button onclick="addPoints('red', 4, 'Mount')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">MOUNT</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-red-400">+4</span>
                </button>
                <button onclick="addPoints('red', 4, 'Back Control')" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600 rounded-md px-2.5 flex items-center justify-between text-left">
                    <span class="font-smooth font-extrabold text-xs sm:text-sm text-slate-200">BACK CONTROL</span>
                    <span class="font-oswald text-xl sm:text-2xl font-bold text-red-400">+4</span>
                </button>
                <button onclick="subtractPoint('red')" class="btn-tap bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-md px-2 flex items-center justify-center space-x-1">
                    <span class="font-smooth font-bold text-xs text-slate-400 uppercase">DESHACER</span>
                    <span class="font-oswald text-base text-red-400 font-bold">-1</span>
                </button>
            </div>

        </div>

    </div>

    <!-- BOTTOM TIMER & FOOTER CONTROLS BAR (SMOOTHCOMP BAR STYLE) -->
    <footer class="w-full bg-[#111620] border-t border-slate-700/80 px-3 py-1.5 shrink-0 flex items-center justify-between z-10">
        <!-- Reset Button -->
        <button onclick="resetMatch()" class="btn-tap bg-slate-800 hover:bg-slate-700 text-slate-200 font-smooth font-bold text-xs sm:text-sm px-3 py-1.5 rounded border border-slate-600 uppercase">
            REINICIAR
        </button>

        <!-- Central Timer Block -->
        <div class="flex items-center space-x-2">
            <div id="timer-display" class="font-oswald text-4xl sm:text-5xl font-bold tracking-wider text-slate-100 bg-[#0A0D14] px-4 py-0.5 rounded border border-slate-700 leading-none">
                03:00
            </div>
        </div>

        <!-- Start/Pause Button -->
        <button id="start-pause-btn" onclick="toggleTimer()" class="btn-tap bg-emerald-600 hover:bg-emerald-500 text-white font-smooth font-extrabold text-xs sm:text-sm px-4 py-1.5 rounded border border-emerald-400 min-w-[85px] text-center uppercase">
            <span id="start-pause-text">INICIAR</span>
        </button>
    </footer>

    <!-- WINNER MODAL -->
    <div id="winner-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div id="winner-card" class="bg-[#19202D] border-2 border-slate-500 rounded-xl p-6 text-center max-w-xs w-full shadow-2xl flex flex-col items-center">
            <h2 id="winner-title" class="font-smooth text-3xl sm:text-4xl font-extrabold tracking-wide uppercase leading-tight mb-2">
                ¡GANADOR!
            </h2>
            <div id="winner-score-display" class="font-oswald text-3xl font-bold text-slate-300 mb-5">
                SCORE: 0 - 0
            </div>
            <div class="w-full space-y-2">
                <button onclick="resetMatch(); closeWinnerModal();" class="btn-tap bg-blue-600 hover:bg-blue-500 text-white font-smooth font-extrabold text-base py-2 rounded-md w-full border border-blue-400 uppercase">
                    NUEVA LUCHA
                </button>
                <button onclick="closeWinnerModal();" class="btn-tap bg-slate-800 hover:bg-slate-700 text-slate-300 font-smooth font-bold text-sm py-1.5 rounded-md w-full border border-slate-600 uppercase">
                    CERRAR
                </button>
            </div>
        </div>
    </div>

    <!-- APP LOGIC -->
    <script>
        const MATCH_DURATION = 180; // 3 minutes
        let timeLeft = MATCH_DURATION;
        let timerInterval = null;
        let isRunning = false;

        const scores = { blue: 0, red: 0 };

        const timerDisplay = document.getElementById('timer-display');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const startPauseText = document.getElementById('start-pause-text');

        // Audio synthesizer
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playBeep(freq = 600, duration = 0.12) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        function playEndAlarm() {
            for(let i = 0; i < 4; i++) {
                setTimeout(() => playBeep(800, 0.3), i * 300);
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
        }

        function toggleTimer() {
            getAudioContext();
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            if (timeLeft <= 0) return;
            isRunning = true;
            startPauseText.textContent = 'PAUSA';
            startPauseBtn.className = 'btn-tap bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs sm:text-sm px-4 py-1.5 rounded border border-amber-400 min-w-[85px] text-center';
            playBeep(700, 0.1);

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    endTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startPauseText.textContent = 'REANUDAR';
            startPauseBtn.className = 'btn-tap bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm px-4 py-1.5 rounded border border-emerald-400 min-w-[85px] text-center';
            playBeep(450, 0.1);
        }

        function endTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startPauseText.textContent = 'FIN';
            timerDisplay.classList.add('timer-ended');
            playEndAlarm();
            showWinnerModal();
        }

        function showWinnerModal() {
            const modal = document.getElementById('winner-modal');
            const card = document.getElementById('winner-card');
            const title = document.getElementById('winner-title');
            const scoreDisplay = document.getElementById('winner-score-display');

            scoreDisplay.textContent = `SCORE FINAL: ${scores.blue} - ${scores.red}`;

            if (scores.blue > scores.red) {
                title.textContent = '¡GANADOR AZUL!';
                title.className = 'font-oswald text-4xl sm:text-5xl font-bold tracking-wide uppercase leading-none mb-2 text-blue-400';
                card.className = 'bg-[#19202D] border-2 border-blue-500 rounded-xl p-6 text-center max-w-xs w-full shadow-2xl flex flex-col items-center';
            } else if (scores.red > scores.blue) {
                title.textContent = '¡GANADOR ROJO!';
                title.className = 'font-oswald text-4xl sm:text-5xl font-bold tracking-wide uppercase leading-none mb-2 text-red-500';
                card.className = 'bg-[#19202D] border-2 border-red-500 rounded-xl p-6 text-center max-w-xs w-full shadow-2xl flex flex-col items-center';
            } else {
                title.textContent = '¡EMPATE!';
                title.className = 'font-oswald text-4xl sm:text-5xl font-bold tracking-wide uppercase leading-none mb-2 text-yellow-400';
                card.className = 'bg-[#19202D] border-2 border-yellow-500 rounded-xl p-6 text-center max-w-xs w-full shadow-2xl flex flex-col items-center';
            }

            modal.classList.remove('hidden');
        }

        function closeWinnerModal() {
            document.getElementById('winner-modal').classList.add('hidden');
        }

        function resetMatch() {
            pauseTimer();
            timeLeft = MATCH_DURATION;
            updateTimerDisplay();
            timerDisplay.classList.remove('timer-ended');
            startPauseText.textContent = 'INICIAR';
            closeWinnerModal();
            scores.blue = 0;
            scores.red = 0;
            updateScoreDisplays();
        }

        function addPoints(fighter, pts) {
            playBeep(600, 0.08);
            scores[fighter] += pts;
            updateScoreDisplays();
        }

        function subtractPoint(fighter) {
            if (scores[fighter] > 0) {
                playBeep(350, 0.08);
                scores[fighter] -= 1;
                updateScoreDisplays();
            }
        }

        function updateScoreDisplays() {
            document.getElementById('blue-score').textContent = scores.blue;
            document.getElementById('red-score').textContent = scores.red;
        }

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
