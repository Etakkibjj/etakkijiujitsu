<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ETAKKI BJJ Referee Scoreboard</title>
    
    <!-- Configuración PWA Meta Tags -->
    <meta name="theme-color" content="#111620">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ETAKKI BJJ">
    <meta name="application-name" content="ETAKKI BJJ Scoreboard">
    <meta name="description" content="Marcador de arbitraje de Jiu-Jitsu ETAKKI con EBI Rules">

    <!-- Web App Manifest Embebido via Data URL -->
    <link rel="manifest" href='data:application/json,{
        "name": "ETAKKI BJJ Referee Scoreboard",
        "short_name": "ETAKKI BJJ",
        "start_url": "./",
        "display": "standalone",
        "background_color": "#161C26",
        "theme_color": "#111620",
        "orientation": "any",
        "icons": [
            {
                "src": "data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23111620%22/><text x=%2250%25%22 y=%2260%25%22 font-size=%2245%22 font-weight=%22900%22 fill=%22%23ffffff%22 text-anchor=%22middle%22 font-style=%22italic%22 font-family=%22sans-serif%22>EJJ</text></svg>",
                "sizes": "192x192 512x512",
                "type": "image/svg+xml"
            }
        ]
    }'>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Barlow Condensed, Montserrat & Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Montserrat:wght@800;900&family=Oswald:wght@700&display=swap" rel="stylesheet">

    <style>
        /* Base Styling with Barlow Condensed & Montserrat */
        body {
            font-family: 'Barlow Condensed', sans-serif;
            background-color: #161C26;
            color: #FFFFFF;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-condensed {
            font-family: 'Barlow Condensed', sans-serif;
        }

        .font-smooth {
            font-family: 'Montserrat', sans-serif;
        }

        .font-oswald {
            font-family: 'Oswald', sans-serif;
        }

        /* Smoothcomp Solid Colors */
        .bg-smooth-dark {
            background-color: #19202D;
        }
        .bg-smooth-card {
            background-color: #212B3B;
        }
        .bg-smooth-blue {
            background-color: #1360EF;
        }
        .bg-smooth-red {
            background-color: #D32F2F;
        }

        /* Active button feedback */
        .btn-tap:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        /* ANIMACIONES Y EFECTOS DE NEÓN PULSANTE */
        @keyframes neon-blue-pulse {
            0%, 100% {
                color: #00F0FF;
                text-shadow: 
                    0 0 7px #00F0FF,
                    0 0 15px #00F0FF,
                    0 0 30px rgba(0, 240, 255, 0.8),
                    0 0 50px rgba(0, 240, 255, 0.5);
            }
            50% {
                color: #E0FFFF;
                text-shadow: 
                    0 0 12px #00F0FF,
                    0 0 25px #00F0FF,
                    0 0 45px rgba(0, 240, 255, 1),
                    0 0 70px rgba(0, 240, 255, 0.8);
            }
        }

        @keyframes neon-red-pulse {
            0%, 100% {
                color: #FF0055;
                text-shadow: 
                    0 0 7px #FF0055,
                    0 0 15px #FF0055,
                    0 0 30px rgba(255, 0, 85, 0.8),
                    0 0 50px rgba(255, 0, 85, 0.5);
            }
            50% {
                color: #FFE6EE;
                text-shadow: 
                    0 0 12px #FF0055,
                    0 0 25px #FF0055,
                    0 0 45px rgba(255, 0, 85, 1),
                    0 0 70px rgba(255, 0, 85, 0.8);
            }
        }

        .neon-blue-glow {
            animation: neon-blue-pulse 2.2s infinite ease-in-out;
        }

        .neon-red-glow {
            animation: neon-red-pulse 2.2s infinite ease-in-out;
        }

        /* Flash on timer finish */
        @keyframes flash-timer {
            0%, 100% { opacity: 1; color: #FF4D4D; }
            50% { opacity: 0.3; color: #FFFFFF; }
        }
        .timer-ended {
            animation: flash-timer 0.6s infinite;
        }
    </style>
</head>
<body class="min-h-screen w-screen bg-[#161C26] text-white flex flex-col justify-between overflow-x-hidden select-none">

    <!-- REGISTRO SERVICE WORKER PWA Y LÓGICA DE LA APLICACIÓN -->
    <script>
        // 1. Registro del Service Worker mediante Blob URL para PWA
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'bjj-scoreboard-v2';
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }

        // Manejo de la instalación PWA
        let deferredPrompt;
        const pwaInstallBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (pwaInstallBtn) pwaInstallBtn.classList.remove('hidden');
        });

        if (pwaInstallBtn) {
            pwaInstallBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        pwaInstallBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                }
            });
        }

        // 2. Lógica del Marcador y Temporizador
        const MATCH_DURATION = 180; // 3 minutos en segundos
        let timeLeft = MATCH_DURATION;
        let timerInterval = null;
        let isRunning = false;

        const scores = { blue: 0, red: 0 };

        const timerDisplay = document.getElementById('timer-display');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const startPauseText = document.getElementById('start-pause-text');

        // Sintetizador de audio Web Audio API
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playBeep(freq = 600, duration = 0.12) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        function playEndAlarm() {
            for(let i = 0; i < 4; i++) {
                setTimeout(() => playBeep(800, 0.3), i * 300);
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            if (timerDisplay) timerDisplay.textContent = formatTime(timeLeft);
        }

        function toggleTimer() {
            getAudioContext();
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            if (timeLeft <= 0) return;
            isRunning = true;
            if (startPauseText) startPauseText.textContent = 'PAUSA';
            if (startPauseBtn) startPauseBtn.className = 'btn-tap bg-amber-600 hover:bg-amber-500 text-white font-condensed font-black text-sm sm:text-base px-5 py-2 rounded-lg border border-amber-400 min-w-[110px] text-center uppercase shadow-lg transition-colors tracking-wider';
            playBeep(700, 0.1);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    endTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            if (startPauseText) startPauseText.textContent = 'REANUDAR';
            if (startPauseBtn) startPauseBtn.className = 'btn-tap bg-emerald-600 hover:bg-emerald-500 text-white font-condensed font-black text-sm sm:text-base px-5 py-2 rounded-lg border border-emerald-400 min-w-[110px] text-center uppercase shadow-lg transition-colors tracking-wider';
            playBeep(450, 0.1);
        }

        function endTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            if (startPauseText) startPauseText.textContent = 'FIN';
            if (timerDisplay) timerDisplay.classList.add('timer-ended');
            playEndAlarm();
            showWinnerModal();
        }

        function showWinnerModal() {
            const modal = document.getElementById('winner-modal');
            const card = document.getElementById('winner-card');
            const title = document.getElementById('winner-title');
            const winnerNameDisplay = document.getElementById('winner-name-display');
            const scoreDisplay = document.getElementById('winner-score-display');

            const blueName = document.getElementById('blue-name').value.trim() || 'LUCHADOR AZUL';
            const redName = document.getElementById('red-name').value.trim() || 'LUCHADOR ROJO';

            if (scoreDisplay) scoreDisplay.textContent = `SCORE: ${scores.blue} - ${scores.red}`;

            if (scores.blue > scores.red) {
                if (winnerNameDisplay) {
                    winnerNameDisplay.textContent = blueName;
                    winnerNameDisplay.className = 'font-condensed text-2xl sm:text-3xl font-black uppercase tracking-wider text-blue-400 mb-1';
                }
                if (title) {
                    title.textContent = '¡GANADOR!';
                    title.className = 'font-oswald text-4xl sm:text-5xl font-black tracking-wide uppercase leading-none mb-3 text-blue-400 neon-blue-glow';
                }
                if (card) card.className = 'bg-[#19202D] border-2 border-blue-500 rounded-2xl p-6 text-center max-w-sm w-full shadow-2xl flex flex-col items-center';
            } else if (scores.red > scores.blue) {
                if (winnerNameDisplay) {
                    winnerNameDisplay.textContent = redName;
                    winnerNameDisplay.className = 'font-condensed text-2xl sm:text-3xl font-black uppercase tracking-wider text-red-400 mb-1';
                }
                if (title) {
                    title.textContent = '¡GANADOR!';
                    title.className = 'font-oswald text-4xl sm:text-5xl font-black tracking-wide uppercase leading-none mb-3 text-red-500 neon-red-glow';
                }
                if (card) card.className = 'bg-[#19202D] border-2 border-red-500 rounded-2xl p-6 text-center max-w-sm w-full shadow-2xl flex flex-col items-center';
            } else {
                if (winnerNameDisplay) {
                    winnerNameDisplay.textContent = 'EMPATE TÉCNICO';
                    winnerNameDisplay.className = 'font-condensed text-2xl sm:text-3xl font-black uppercase tracking-wider text-yellow-400 mb-1';
                }
                if (title) {
                    title.textContent = '¡EMPATE!';
                    title.className = 'font-oswald text-4xl sm:text-5xl font-black tracking-wide uppercase leading-none mb-3 text-yellow-400';
                }
                if (card) card.className = 'bg-[#19202D] border-2 border-yellow-500 rounded-2xl p-6 text-center max-w-sm w-full shadow-2xl flex flex-col items-center';
            }

            if (modal) modal.classList.remove('hidden');
        }

        function closeWinnerModal() {
            const modal = document.getElementById('winner-modal');
            if (modal) modal.classList.add('hidden');
        }

        function resetMatch() {
            pauseTimer();
            timeLeft = MATCH_DURATION;
            updateTimerDisplay();
            if (timerDisplay) timerDisplay.classList.remove('timer-ended');
            if (startPauseText) startPauseText.textContent = 'INICIAR';
            closeWinnerModal();
            scores.blue = 0;
            scores.red = 0;
            updateScoreDisplays();
        }

        function addPoints(fighter, pts) {
            playBeep(600, 0.08);
            scores[fighter] += pts;
            updateScoreDisplays();
        }

        function subtractPoint(fighter) {
            if (scores[fighter] > 0) {
                playBeep(350, 0.08);
                scores[fighter] -= 1;
                updateScoreDisplays();
            }
        }

        function updateScoreDisplays() {
            const blueScoreEl = document.getElementById('blue-score');
            const redScoreEl = document.getElementById('red-score');
            if (blueScoreEl) blueScoreEl.textContent = scores.blue;
            if (redScoreEl) redScoreEl.textContent = scores.red;
        }

        // Inicializar pantalla al cargar
        updateTimerDisplay();
        updateScoreDisplays();
    </script>
</body>
</html>
