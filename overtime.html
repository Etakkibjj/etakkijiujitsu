<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ETAKKI BJJ Referee Scoreboard</title>
    
    <!-- Configuración PWA Meta Tags -->
    <meta name="theme-color" content="#111620">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ETAKKI BJJ">
    <meta name="application-name" content="ETAKKI BJJ Scoreboard">
    <meta name="description" content="Marcador de arbitraje de Jiu-Jitsu ETAKKI con EBI Rules">

    <!-- Web App Manifest Embebido via Data URL -->
    <link rel="manifest" href='data:application/json,{
        "name": "ETAKKI BJJ Referee Scoreboard",
        "short_name": "ETAKKI BJJ",
        "start_url": "./",
        "display": "standalone",
        "background_color": "#161C26",
        "theme_color": "#111620",
        "orientation": "any",
        "icons": [
            {
                "src": "data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23111620%22/><text x=%2250%25%22 y=%2260%25%22 font-size=%2245%22 font-weight=%22900%22 fill=%22%23ffffff%22 text-anchor=%22middle%22 font-style=%22italic%22 font-family=%22sans-serif%22>EJJ</text></svg>",
                "sizes": "192x192 512x512",
                "type": "image/svg+xml"
            }
        ]
    }'>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Barlow Condensed, Montserrat & Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Montserrat:wght@800;900&family=Oswald:wght@700&display=swap" rel="stylesheet">

    <style>
        /* Base Styling with Barlow Condensed & Montserrat */
        body {
            font-family: 'Barlow Condensed', sans-serif;
            background-color: #161C26;
            color: #FFFFFF;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-condensed {
            font-family: 'Barlow Condensed', sans-serif;
        }

        .font-smooth {
            font-family: 'Montserrat', sans-serif;
        }

        .font-oswald {
            font-family: 'Oswald', sans-serif;
        }

        /* Smoothcomp Solid Colors */
        .bg-smooth-dark {
            background-color: #19202D;
        }
        .bg-smooth-card {
            background-color: #212B3B;
        }
        .bg-smooth-blue {
            background-color: #1360EF;
        }
        .bg-smooth-red {
            background-color: #D32F2F;
        }

        /* Active button feedback */
        .btn-tap:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        /* ANIMACIONES Y EFECTOS DE NEÓN PULSANTE */
        @keyframes neon-blue-pulse {
            0%, 100% {
                color: #00F0FF;
                text-shadow: 
                    0 0 7px #00F0FF,
                    0 0 15px #00F0FF,
                    0 0 30px rgba(0, 240, 255, 0.8),
                    0 0 50px rgba(0, 240, 255, 0.5);
            }
            50% {
                color: #E0FFFF;
                text-shadow: 
                    0 0 12px #00F0FF,
                    0 0 25px #00F0FF,
                    0 0 45px rgba(0, 240, 255, 1),
                    0 0 70px rgba(0, 240, 255, 0.8);
            }
        }

        @keyframes neon-red-pulse {
            0%, 100% {
                color: #FF0055;
                text-shadow: 
                    0 0 7px #FF0055,
                    0 0 15px #FF0055,
                    0 0 30px rgba(255, 0, 85, 0.8),
                    0 0 50px rgba(255, 0, 85, 0.5);
            }
            50% {
                color: #FFE6EE;
                text-shadow: 
                    0 0 12px #FF0055,
                    0 0 25px #FF0055,
                    0 0 45px rgba(255, 0, 85, 1),
                    0 0 70px rgba(255, 0, 85, 0.8);
            }
        }

        .neon-blue-glow {
            animation: neon-blue-pulse 2.2s infinite ease-in-out;
        }

        .neon-red-glow {
            animation: neon-red-pulse 2.2s infinite ease-in-out;
        }

        /* Flash on timer finish */
        @keyframes flash-timer {
            0%, 100% { opacity: 1; color: #FF4D4D; }
            50% { opacity: 0.3; color: #FFFFFF; }
        }
        .timer-ended {
            animation: flash-timer 0.6s infinite;
        }
    </style>
</head>
<body class="min-h-screen w-screen bg-[#161C26] text-white flex flex-col justify-between overflow-x-hidden select-none">

    <!-- HEADER SUPERIOR CENTRADO CON TIPOGRAFÍA CONDENSADA Y LOGO EJJ -->
    <header class="w-full bg-[#111620] border-b border-slate-700/60 px-3 py-2.5 flex items-center justify-between shrink-0 z-20 shadow-md relative">
        
        <!-- Logo EJJ Vectorial a la izquierda -->
        <div class="flex items-center space-x-2 shrink-0 z-10">
            <div class="w-9 h-7 flex items-center justify-center">
                <svg viewBox="0 0 120 70" class="w-full h-full text-white fill-current drop-shadow">
                    <path d="M 15 5 L 115 5 Q 118 5 116 12 L 105 62 Q 103 68 95 68 L 5 68 Q 2 68 4 61 L 15 12 Q 17 5 25 5 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <text x="58" y="52" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="44" fill="currentColor" text-anchor="middle" letter-spacing="-2">EJJ</text>
                </svg>
            </div>
        </div>

        <!-- Encabezado Centrado con Tipografía Condensada Grande -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none px-12">
            <h1 class="font-condensed font-black text-lg sm:text-2xl md:text-3xl tracking-widest text-slate-100 uppercase text-center truncate drop-shadow-md">
                ETAKKI JIU JITSU - EJJ SUB ONLY 3 - EBI RULES
            </h1>
        </div>

        <!-- Botón de instalación PWA -->
        <div class="shrink-0 z-10">
            <button id="pwa-install-btn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2.5 py-1 rounded shadow flex items-center space-x-1">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M13 8V2H7v6H2l8 8 8-8h-5zM0 18h20v2H0v-2z"/></svg>
                <span class="hidden sm:inline font-condensed">INSTALAR</span>
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 flex flex-col min-h-0 w-full p-2 space-y-2 max-w-7xl mx-auto">
        
        <!-- PANTALLA DE PUNTUACIÓN GIGANTE CON LUCHADORES NEÓN -->
        <div class="grid grid-cols-2 gap-2 flex-1 min-h-[260px] w-full">
            
            <!-- BLOQUE LUCHADOR AZUL -->
            <div class="flex flex-col bg-[#19202D] rounded-xl overflow-hidden border border-slate-700/80 shadow-lg">
                <!-- Encabezado Azul -->
                <div class="bg-smooth-blue px-2 py-1.5 text-center shrink-0">
                    <h2 class="font-condensed text-base sm:text-lg md:text-xl font-extrabold tracking-wider text-white leading-none uppercase">
                        LUCHADOR AZUL
                    </h2>
                </div>

                <!-- Input Nombre Participante con Bandera y Animación Neón Azul -->
                <div class="bg-[#151C28] px-3 py-2 border-b border-slate-800 flex items-center justify-center space-x-3">
                    <div class="w-8 h-6 sm:w-11 sm:h-8 shrink-0 rounded shadow overflow-hidden border border-slate-600">
                        <svg viewBox="0 0 900 600" class="w-full h-full">
                            <rect width="900" height="600" fill="#74acdf"/>
                            <rect y="200" width="900" height="200" fill="#ffffff"/>
                            <circle cx="450" cy="300" r="45" fill="#f6b40e"/>
                            <path d="M 450 240 L 450 360 M 390 300 L 510 300 M 408 258 L 492 342 M 408 342 L 492 258" stroke="#843b14" stroke-width="6" stroke-linecap="round"/>
                        </svg>
                    </div>

                    <div class="flex flex-col flex-1 text-left min-w-0">
                        <!-- Nombre con Neón Pulsante Azul Cian -->
                        <input type="text" 
                               id="blue-name" 
                               placeholder="NOMBRE LUCHADOR" 
                               value="LUKE SKYWALKER"
                               class="w-full bg-transparent font-condensed font-bold text-2xl sm:text-4xl md:text-5xl neon-blue-glow focus:outline-none uppercase tracking-wide leading-none truncate">
                        
                        <!-- Equipo / País -->
                        <input type="text" 
                               id="blue-team" 
                               placeholder="PAÍS / EQUIPO" 
                               value="ARG DYNAMIX"
                               class="w-full bg-transparent font-condensed font-normal text-xs sm:text-base md:text-lg text-slate-400 focus:outline-none uppercase tracking-wider leading-tight truncate">
                    </div>
                </div>

                <!-- Puntuación Duplicada en Tamaño (2X Big Score Display) -->
                <div class="flex-1 flex items-center justify-center bg-[#0C1018] min-h-[140px] p-2 overflow-hidden">
                    <span id="blue-score" class="font-oswald text-[120px] sm:text-[170px] md:text-[210px] font-bold text-white leading-none drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] select-none">0</span>
                </div>
            </div>

            <!-- BLOQUE LUCHADOR ROJO -->
            <div class="flex flex-col bg-[#19202D] rounded-xl overflow-hidden border border-slate-700/80 shadow-lg">
                <!-- Encabezado Rojo -->
                <div class="bg-smooth-red px-2 py-1.5 text-center shrink-0">
                    <h2 class="font-condensed text-base sm:text-lg md:text-xl font-extrabold tracking-wider text-white leading-none uppercase">
                        LUCHADOR ROJO
                    </h2>
                </div>

                <!-- Input Nombre Participante con Bandera y Animación Neón Rojo -->
                <div class="bg-[#151C28] px-3 py-2 border-b border-slate-800 flex items-center justify-center space-x-3">
                    <div class="w-8 h-6 sm:w-11 sm:h-8 shrink-0 rounded shadow overflow-hidden border border-slate-600">
                        <svg viewBox="0 0 900 600" class="w-full h-full">
                            <rect width="900" height="600" fill="#74acdf"/>
                            <rect y="200" width="900" height="200" fill="#ffffff"/>
                            <circle cx="450" cy="300" r="45" fill="#f6b40e"/>
                            <path d="M 450 240 L 450 360 M 390 300 L 510 300 M 408 258 L 492 342 M 408 342 L 492 258" stroke="#843b14" stroke-width="6" stroke-linecap="round"/>
                        </svg>
                    </div>

                    <div class="flex flex-col flex-1 text-left min-w-0">
                        <!-- Nombre con Neón Pulsante Rojo/Rosa -->
                        <input type="text" 
                               id="red-name" 
                               placeholder="NOMBRE LUCHADOR" 
                               value="DARTH VADER"
                               class="w-full bg-transparent font-condensed font-bold text-2xl sm:text-4xl md:text-5xl neon-red-glow focus:outline-none uppercase tracking-wide leading-none truncate">
                        
                        <!-- Equipo / País -->
                        <input type="text" 
                               id="red-team" 
                               placeholder="PAÍS / EQUIPO" 
                               value="ARG TEAM ALFA"
                               class="w-full bg-transparent font-condensed font-normal text-xs sm:text-base md:text-lg text-slate-400 focus:outline-none uppercase tracking-wider leading-tight truncate">
                    </div>
                </div>

                <!-- Puntuación Duplicada en Tamaño (2X Big Score Display) -->
                <div class="flex-1 flex items-center justify-center bg-[#0C1018] min-h-[140px] p-2 overflow-hidden">
                    <span id="red-score" class="font-oswald text-[120px] sm:text-[170px] md:text-[210px] font-bold text-white leading-none drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] select-none">0</span>
                </div>
            </div>

        </div>

        <!-- 3 BOTONES EXCLUSIVOS DE PUNTUACIÓN POR LADO (+2, +3, +4) Y DESHACER -->
        <div class="grid grid-cols-2 gap-2 w-full">
            
            <!-- BOTONES LADO AZUL -->
            <div class="flex flex-col space-y-1.5 sm:space-y-2">
                <button onclick="addPoints('blue', 2)" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600/90 rounded-lg p-2 flex items-center justify-between text-left shadow">
                    <span class="font-condensed font-bold text-xs sm:text-sm text-slate-200 tracking-wide uppercase leading-tight">TAKEDOWN / SWEEP / KOB</span>
                    <span class="font-oswald text-2xl sm:text-3xl font-bold text-blue-400 ml-1">+2</span>
                </button>
                <button onclick="addPoints('blue', 3)" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600/90 rounded-lg p-2 flex items-center justify-between text-left shadow">
                    <span class="font-condensed font-bold text-xs sm:text-sm text-slate-200 tracking-wide uppercase leading-tight">GUARD PASS</span>
                    <span class="font-oswald text-2xl sm:text-3xl font-bold text-blue-400 ml-1">+3</span>
                </button>
                <button onclick="addPoints('blue', 4)" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600/90 rounded-lg p-2 flex items-center justify-between text-left shadow">
                    <span class="font-condensed font-bold text-xs sm:text-sm text-slate-200 tracking-wide uppercase leading-tight">MOUNT / BACK CONTROL</span>
                    <span class="font-oswald text-2xl sm:text-3xl font-bold text-blue-400 ml-1">+4</span>
                </button>
                <button onclick="subtractPoint('blue')" class="btn-tap bg-slate-900/90 hover:bg-slate-800 border border-slate-700 rounded-lg p-1.5 flex items-center justify-center space-x-2 shadow">
                    <span class="font-condensed font-bold text-xs text-slate-400 uppercase tracking-wider">DESHACER</span>
                    <span class="font-oswald text-base text-red-400 font-bold">-1</span>
                </button>
            </div>

            <!-- BOTONES LADO ROJO -->
            <div class="flex flex-col space-y-1.5 sm:space-y-2">
                <button onclick="addPoints('red', 2)" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600/90 rounded-lg p-2 flex items-center justify-between text-left shadow">
                    <span class="font-condensed font-bold text-xs sm:text-sm text-slate-200 tracking-wide uppercase leading-tight">TAKEDOWN / SWEEP / KOB</span>
                    <span class="font-oswald text-2xl sm:text-3xl font-bold text-red-400 ml-1">+2</span>
                </button>
                <button onclick="addPoints('red', 3)" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600/90 rounded-lg p-2 flex items-center justify-between text-left shadow">
                    <span class="font-condensed font-bold text-xs sm:text-sm text-slate-200 tracking-wide uppercase leading-tight">GUARD PASS</span>
                    <span class="font-oswald text-2xl sm:text-3xl font-bold text-red-400 ml-1">+3</span>
                </button>
                <button onclick="addPoints('red', 4)" class="btn-tap bg-[#212B3B] hover:bg-slate-700 border border-slate-600/90 rounded-lg p-2 flex items-center justify-between text-left shadow">
                    <span class="font-condensed font-bold text-xs sm:text-sm text-slate-200 tracking-wide uppercase leading-tight">MOUNT / BACK CONTROL</span>
                    <span class="font-oswald text-2xl sm:text-3xl font-bold text-red-400 ml-1">+4</span>
                </button>
                <button onclick="subtractPoint('red')" class="btn-tap bg-slate-900/90 hover:bg-slate-800 border border-slate-700 rounded-lg p-1.5 flex items-center justify-center space-x-2 shadow">
                    <span class="font-condensed font-bold text-xs text-slate-400 uppercase tracking-wider">DESHACER</span>
                    <span class="font-oswald text-base text-red-400 font-bold">-1</span>
                </button>
            </div>

        </div>

    </main>
