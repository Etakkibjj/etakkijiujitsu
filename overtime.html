    <!-- REGISTRO SERVICE WORKER Y LÓGICA DE LA APLICACIÓN -->
    <script>
        // Service Worker inline via Blob URL
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'bjj-scoreboard-v2';
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        let deferredPrompt;
        const pwaInstallBtn = document.getElementById('pwa-install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (pwaInstallBtn) pwaInstallBtn.classList.remove('hidden');
        });

        if (pwaInstallBtn) {
            pwaInstallBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') pwaInstallBtn.classList.add('hidden');
                    deferredPrompt = null;
                }
            });
        }

        // Lógica de Marcador y Reloj
        const MATCH_DURATION = 180;
        let timeLeft = MATCH_DURATION;
        let timerInterval = null;
        let isRunning = false;
        const scores = { blue: 0, red: 0 };

        const timerDisplay = document.getElementById('timer-display');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const startPauseText = document.getElementById('start-pause-text');

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playBeep(freq = 600, duration = 0.12) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        function playEndAlarm() {
            for(let i = 0; i < 4; i++) {
                setTimeout(() => playBeep(800, 0.3), i * 300);
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
        }

        function toggleTimer() {
            getAudioContext();
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            if (timeLeft <= 0) return;
            isRunning = true;
            startPauseText.textContent = 'PAUSA';
            startPauseBtn.className = 'btn-tap bg-amber-600 hover:bg-amber-500 text-white font-condensed font-bold text-base sm:text-lg px-5 py-1.5 rounded-lg border border-amber-400 min-w-[110px] text-center uppercase shadow-lg transition-colors';
            playBeep(700, 0.1);

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    endTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startPauseText.textContent = 'REANUDAR';
            startPauseBtn.className = 'btn-tap bg-emerald-600 hover:bg-emerald-500 text-white font-condensed font-bold text-base sm:text-lg px-5 py-1.5 rounded-lg border border-emerald-400 min-w-[110px] text-center uppercase shadow-lg transition-colors';
            playBeep(450, 0.1);
        }

        function endTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startPauseText.textContent = 'FIN';
            timerDisplay.classList.add('timer-ended');
            playEndAlarm();
            showWinnerModal();
        }

        function showWinnerModal() {
            const modal = document.getElementById('winner-modal');
            const card = document.getElementById('winner-card');
            const title = document.getElementById('winner-title');
            const winnerNameDisplay = document.getElementById('winner-name-display');
            const scoreDisplay = document.getElementById('winner-score-display');

            const blueName = document.getElementById('blue-name').value.trim() || 'LUCHADOR AZUL';
            const redName = document.getElementById('red-name').value.trim() || 'LUCHADOR ROJO';

            scoreDisplay.textContent = `${scores.blue} - ${scores.red}`;

            if (scores.blue > scores.red) {
                winnerNameDisplay.textContent = blueName;
                winnerNameDisplay.className = 'font-condensed text-2xl sm:text-3xl font-extrabold uppercase tracking-wider text-blue-400 mb-1';
                title.textContent = '¡GANADOR!';
                title.className = 'font-oswald text-4xl sm:text-5xl font-black tracking-wide uppercase leading-none mb-3 text-blue-400';
                card.className = 'bg-[#19202D] border-2 border-blue-500 rounded-2xl p-6 text-center max-w-sm w-full shadow-2xl flex flex-col items-center';
            } else if (scores.red > scores.blue) {
                winnerNameDisplay.textContent = redName;
                winnerNameDisplay.className = 'font-condensed text-2xl sm:text-3xl font-extrabold uppercase tracking-wider text-red-400 mb-1';
                title.textContent = '¡GANADOR!';
                title.className = 'font-oswald text-4xl sm:text-5xl font-black tracking-wide uppercase leading-none mb-3 text-red-500';
                card.className = 'bg-[#19202D] border-2 border-red-500 rounded-2xl p-6 text-center max-w-sm w-full shadow-2xl flex flex-col items-center';
            } else {
                winnerNameDisplay.textContent = 'EMPATE TÉCNICO';
                winnerNameDisplay.className = 'font-condensed text-2xl sm:text-3xl font-extrabold uppercase tracking-wider text-yellow-400 mb-1';
                title.textContent = '¡EMPATE!';
                title.className = 'font-oswald text-4xl sm:text-5xl font-black tracking-wide uppercase leading-none mb-3 text-yellow-400';
                card.className = 'bg-[#19202D] border-2 border-yellow-500 rounded-2xl p-6 text-center max-w-sm w-full shadow-2xl flex flex-col items-center';
            }

            modal.classList.remove('hidden');
        }

        function closeWinnerModal() {
            document.getElementById('winner-modal').classList.add('hidden');
        }

        function resetMatch() {
            pauseTimer();
            timeLeft = MATCH_DURATION;
            updateTimerDisplay();
            timerDisplay.classList.remove('timer-ended');
            startPauseText.textContent = 'INICIAR';
            closeWinnerModal();
            scores.blue = 0;
            scores.red = 0;
            updateScoreDisplays();
        }

        function addPoints(fighter, pts) {
            playBeep(600, 0.08);
            scores[fighter] += pts;
            updateScoreDisplays();
        }

        function subtractPoint(fighter) {
            if (scores[fighter] > 0) {
                playBeep(350, 0.08);
                scores[fighter] -= 1;
                updateScoreDisplays();
            }
        }

        function updateScoreDisplays() {
            document.getElementById('blue-score').textContent = scores.blue;
            document.getElementById('red-score').textContent = scores.red;
        }
    </script>
</body>
</html>
