<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">

    <title>Martial Arts Strength Training</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#ff8400',
                            500: '#ff6600',
                            600: '#e05300',
                        },
                        cardbg: '#141a23',
                        appbg: '#0a0d12'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0d12;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .set-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 0.5rem;
        }
        @media (min-width: 640px) {
            .set-row {
                gap: 1rem;
            }
        }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-100 flex flex-col items-center">

                </div>
            </div>

            <!-- Day Select Dropdown -->
            <select id="dayDropdown" onchange="switchDay(parseInt(this.value))" class="bg-slate-900 border border-brand-500/40 text-brand-400 font-extrabold text-xs sm:text-sm rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-brand-500">
                <option value="1">DÍA 1: Zercher & Fuerza</option>

                <option value="5">DÍA 5: Bloques & Remo</option>
                <option value="6">DÍA 6: Press Militar & PM</option>
            </select>
        </div>

        <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            <button onclick="switchDay(1)" class="day-tab flex-1 min-w-[55px] py-2 px-2 rounded-lg font-black text-xs tracking-wider transition-all uppercase text-center bg-slate-800 text-slate-400">DÍA 1</button>

            <!-- Dynamic Content -->

        function switchDay(day) {
            currentDay = day;
            document.getElementById('dayDropdown').value = day;

                if ((index + 1) === day) {
                    tab.className = "day-tab flex-1 min-w-[55px] py-2 px-2 rounded-lg font-black text-xs tracking-wider transition-all uppercase text-center bg-brand-500 text-slate-950 shadow-lg shadow-brand-500/20";

            });

                            <div class="flex items-center gap-2 min-w-0">
                                <span class="text-slate-400 font-mono font-bold text-xs uppercase tracking-wider shrink-0">
                                    SERIE <span class="text-brand-400 font-black">${setNumFormatted}</span>
                                </span>
                            </div>

                            <!-- Middle: Reps & Weight Info -->
                            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                                <span class="text-slate-100 font-black text-base sm:text-xl tracking-tight">
                                    ${set.reps} <span class="text-xs sm:text-sm font-semibold text-slate-400">REPS</span>
                                </span>

                                ${set.weight ? `
                                    <span class="bg-brand-500/10 border border-brand-500/20 text-brand-400 font-black text-xs sm:text-sm px-2 sm:px-2.5 py-0.5 rounded-lg whitespace-nowrap">
                                        ${set.weight.replace('.', ',')} <span class="text-[10px] sm:text-xs">KG</span>
                                    </span>
                                ` : `
                                    <span class="bg-slate-800 border border-slate-700 text-slate-400 font-bold text-[10px] sm:text-xs px-2 py-0.5 rounded-lg">
                                        CORPORAL
                                    </span>
                                `}
                            </div>

                            <!-- Right: Interactive Checkbox -->
                            <button onclick="toggleSet('${key}')" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl border-2 flex items-center justify-center transition-all shrink-0 ml-2 ${isChecked ? 'bg-brand-500 border-brand-500 text-slate-950 shadow-lg shadow-brand-500/30' : 'border-slate-700 bg-slate-800/80 hover:border-brand-500'}">
                                <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                                </svg>
                            </button>
                        </div>
                    `;
                });

                html += `</div>`;
                exCard.innerHTML = html;
                container.appendChild(exCard);
            });

            document.getElementById('completedCounter').innerText = completedSets;
            document.getElementById('totalCounter').innerText = totalSets;
            const pct = totalSets > 0 ? (completedSets / totalSets) * 100 : 0;
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function toggleSet(key) {
            const previousState = !!userProgress[key];
            userProgress[key] = !previousState;
            
            localStorage.setItem('ma_strength_progress_v5', JSON.stringify(userProgress));
            renderWorkout();

            if (!previousState) {
                openTimerModal();
            }
        }

        function resetCurrentDay() {
            if (confirm(`¿Reiniciar el progreso completo de DÍA ${currentDay}?`)) {
                Object.keys(userProgress).forEach(key => {
                    if (key.startsWith(`day_${currentDay}_`)) {
                        delete userProgress[key];
                    }
                });
                localStorage.setItem('ma_strength_progress_v5', JSON.stringify(userProgress));
                renderWorkout();
            }
        }

        function openTimerModal() {
            document.getElementById('timerModal').classList.remove('hidden');
        }

        function closeTimerModal() {
            document.getElementById('timerModal').classList.add('hidden');
        }

        function startTimer(seconds) {
            closeTimerModal();
            timeRemaining = seconds;
            
            document.getElementById('timerWidget').classList.remove('hidden');
            updateTimerDisplay();

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    playAlarmSound();
                }
            }, 1000);
        }

        function addTime(seconds) {
            timeRemaining += seconds;
            updateTimerDisplay();
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timerWidget').classList.add('hidden');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            document.getElementById('timerDisplay').innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function playAlarmSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }
    </script>
</body>
</html>
