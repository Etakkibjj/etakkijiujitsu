    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            400: '#fb923c',
                            500: '#f97316', // Primary Athletic Orange
                            600: '#ea580c',
                            700: '#c2410c',
                            900: '#7c2d12',
                        },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        borderbg: '#334155'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }

    <style>
        /* Force single-line horizontal flex for sets on mobile */
        .set-row {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: space-between !important;
            white-space: nowrap !important;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f97316;
        }
    </style>

                    </div>
                </div>

                    <select id="dayDropdown" onchange="switchDay(parseInt(this.value))" class="bg-slate-800 border border-slate-700 text-brand-400 text-xs font-bold rounded-lg px-2.5 py-1.5 outline-none focus:border-brand-500 md:hidden">
                        <option value="1">DÍA 1</option>

                        <option value="6">DÍA 6</option>

                    <button onclick="resetCurrentDay()" title="Reiniciar progreso del día actual" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>

        function switchDay(day) {
            currentDay = day;
            document.getElementById('dayDropdown').value = day;
            
            // Update tabs UI
            document.querySelectorAll('.day-tab').forEach((tab, index) => {
                if ((index + 1) === day) {
                    tab.className = "day-tab flex-1 min-w-[70px] py-2 px-3 rounded-lg font-black text-xs tracking-wider transition-all uppercase text-center bg-brand-500 text-slate-950 shadow-lg shadow-brand-500/20";

                    tab.className = "day-tab flex-1 min-w-[70px] py-2 px-3 rounded-lg font-black text-xs tracking-wider transition-all uppercase text-center bg-slate-800 text-slate-400 hover:bg-slate-700";

            });

            renderWorkout();
        }

            let completedSets = 0;

                        <div id="row-${key}" class="set-row p-2.5 sm:p-3 rounded-xl border transition-all ${isChecked ? 'bg-slate-900/60 border-brand-500/30 opacity-75' : 'bg-slate-900 border-slate-800 hover:border-slate-700'}">
                            <!-- Left: Set Badge -->
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="text-slate-400 font-mono font-bold text-xs uppercase tracking-wider shrink-0">
                                    SERIE <span class="text-brand-400 font-black">${setNumFormatted}</span>
                                </span>
                            </div>

                            <!-- Middle: Reps & Weight Info -->
                            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                                <span class="text-slate-100 font-black text-base sm:text-xl tracking-tight">
                                    ${set.reps} <span class="text-xs sm:text-sm font-semibold text-slate-400">REPS</span>
                                </span>

                                ${set.weight ? `
                                    <span class="bg-brand-500/10 border border-brand-500/20 text-brand-400 font-black text-xs sm:text-sm px-2 sm:px-2.5 py-0.5 rounded-lg whitespace-nowrap">
                                        ${set.weight.replace('.', ',')} <span class="text-[10px] sm:text-xs">KG</span>
                                    </span>
                                ` : `
                                    <span class="bg-slate-800 border border-slate-700 text-slate-400 font-bold text-[10px] sm:text-xs px-2 py-0.5 rounded-lg">
                                        CORPORAL
                                    </span>
                                `}
                            </div>

                            <!-- Right: Interactive Checkbox -->
                            <button onclick="toggleSet('${key}')" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl border-2 flex items-center justify-center transition-all shrink-0 ml-2 ${isChecked ? 'bg-brand-500 border-brand-500 text-slate-950 shadow-lg shadow-brand-500/30' : 'border-slate-700 bg-slate-800/80 hover:border-brand-500'}">
                                <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                                </svg>
                            </button>
                        </div>
                    `;
                });

                html += `</div>`;
                exCard.innerHTML = html;
                container.appendChild(exCard);
            });

            // Update Progress Bar & Counter
            document.getElementById('completedCounter').innerText = completedSets;
            document.getElementById('totalCounter').innerText = totalSets;
            const pct = totalSets > 0 ? (completedSets / totalSets) * 100 : 0;
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function toggleSet(key) {
            const previousState = !!userProgress[key];
            userProgress[key] = !previousState;
            
            localStorage.setItem('ma_strength_progress_v3', JSON.stringify(userProgress));
            renderWorkout();

            // Trigger timer prompt if checking a set
            if (!previousState) {
                openTimerModal();
            }
        }

        function resetCurrentDay() {
            if (confirm(`¿Reiniciar el progreso completo de DÍA ${currentDay}?`)) {
                Object.keys(userProgress).forEach(key => {
                    if (key.startsWith(`day_${currentDay}_`)) {
                        delete userProgress[key];
                    }
                });
                localStorage.setItem('ma_strength_progress_v3', JSON.stringify(userProgress));
                renderWorkout();
            }
        }

        // Timer Logic
        function openTimerModal() {
            document.getElementById('timerModal').classList.remove('hidden');
        }

        function closeTimerModal() {
            document.getElementById('timerModal').classList.add('hidden');
        }

        function startTimer(seconds) {
            closeTimerModal();
            timeRemaining = seconds;
            
            document.getElementById('timerWidget').classList.remove('hidden');
            updateTimerDisplay();

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    playAlarmSound();
                }
            }, 1000);
        }

        function addTime(seconds) {
            timeRemaining += seconds;
            updateTimerDisplay();
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timerWidget').classList.add('hidden');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            document.getElementById('timerDisplay').innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function playAlarmSound() {
            // Audio cue using Web Audio API for cross-device compatibility
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // Note A5
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }
    </script>
</body>
</html>
